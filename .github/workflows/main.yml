name: Build God Bridge Mod

on:
  workflow_dispatch:
  push:
    paths:
      - 'GodBridgeClientUltra-source-v0.2.0.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          curl -L https://services.gradle.org/distributions/gradle-2.14.1-bin.zip -o /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo '/opt/gradle-2.14.1/bin' >> "$GITHUB_PATH"

      - name: Extract project
        run: |
          mkdir project
          unzip -q GodBridgeClientUltra-source-v0.2.0.zip -d project
          find project -name build.gradle -print

      - name: Build mod
        run: |
          cd project/GodBridgeClientUltra
          gradle --no-daemon build

      - name: Upload JAR artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GodBridgeMod-JAR
          path: project/GodBridgeClientUltra/build/libs/*.jar
          if-no-files-found: error
